<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="wlylabs — solo builder shipping zero-knowledge, offline-first web apps">
  <title>wlylabs — solo builder shipping zero-knowledge, offline-first web apps</title>
  <defs>
    <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="h-grid" d="M40 0H0V40" fill="none" stroke-width="1"/>
    </pattern>
    <linearGradient id="h-word" x1="0" y1="0" x2="1" y2="0.6">
      <stop class="h-sa" offset="0%"/>
      <stop class="h-sa" offset="58%"/>
      <stop class="h-sb" offset="100%"/>
    </linearGradient>
    <linearGradient id="h-bar" x1="0" y1="0" x2="1" y2="0">
      <stop class="h-sa" offset="0%"/>
      <stop class="h-sb" offset="100%"/>
    </linearGradient>
    <!--
      User space, not the default bounding box: the middle path is a straight
      horizontal line, and a box with no height would leave a bounding-box
      gradient with nothing to paint into.
    -->
    <linearGradient id="h-conv" gradientUnits="userSpaceOnUse" x1="716" y1="0" x2="1144" y2="0">
      <stop class="h-sa" offset="0%"/>
      <stop class="h-sb" offset="100%"/>
    </linearGradient>
    <linearGradient id="h-area" x1="0" y1="0" x2="1" y2="0">
      <stop class="h-s-area-t" offset="0%"/>
      <stop class="h-s-area-b" offset="100%"/>
    </linearGradient>
    <radialGradient id="h-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop class="h-s-glow-a" offset="0%"/>
      <stop class="h-s-clear-a" offset="100%"/>
    </radialGradient>
    <radialGradient id="h-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop class="h-s-glow-b" offset="0%"/>
      <stop class="h-s-clear-b" offset="100%"/>
    </radialGradient>
    <style>
      .h-bg{fill:#FFFFFF;}.h-grid{stroke:#EEF1F5;stroke-opacity:1;}.h-edge{stroke:#DCE1E7;}.h-surf{fill:#F7F8FA;stroke:#DCE1E7;}.h-tx{fill:#0D1117;}.h-mu{fill:#5B6570;}.h-fa{fill:#7A838F;}.h-hair{stroke:#C9D1DA;}.h-aa{fill:#C2551F;}.h-ab{fill:#412991;}.h-sa{stop-color:#C2551F;}.h-sb{stop-color:#412991;}.h-s-area-t{stop-color:#C2551F;stop-opacity:0.34;}.h-s-area-b{stop-color:#C2551F;stop-opacity:0;}.h-s-glow-a{stop-color:#D97757;stop-opacity:0.1;}.h-s-glow-b{stop-color:#412991;stop-opacity:0.12;}.h-s-clear-a{stop-color:#D97757;stop-opacity:0;}.h-s-clear-b{stop-color:#412991;stop-opacity:0;}@media (prefers-color-scheme:dark){.h-bg{fill:#0D1117;}.h-grid{stroke:#161B22;stroke-opacity:0.55;}.h-edge{stroke:#232B35;}.h-surf{fill:#11161D;stroke:#232B35;}.h-tx{fill:#E6EDF3;}.h-mu{fill:#8B949E;}.h-fa{fill:#6E7781;}.h-hair{stroke:#2D3540;}.h-aa{fill:#E8895F;}.h-ab{fill:#8B5CF6;}.h-sa{stop-color:#E8895F;}.h-sb{stop-color:#8B5CF6;}.h-s-area-t{stop-color:#E8895F;stop-opacity:0.34;}.h-s-area-b{stop-color:#E8895F;stop-opacity:0;}.h-s-glow-a{stop-color:#D97757;stop-opacity:0.18;}.h-s-glow-b{stop-color:#412991;stop-opacity:0.21;}.h-s-clear-a{stop-color:#D97757;stop-opacity:0;}.h-s-clear-b{stop-color:#412991;stop-opacity:0;}}
      .h-mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
      @keyframes h-cyc{0%{opacity:0;}2%{opacity:1;}21.5%{opacity:1;}25%{opacity:0;}100%{opacity:0;}}
      .h-line{opacity:0;}
      .h-l0{animation:h-cyc 13.6s 0s infinite;}.h-l1{animation:h-cyc 13.6s 3.4s infinite;}.h-l2{animation:h-cyc 13.6s 6.8s infinite;}.h-l3{animation:h-cyc 13.6s 10.2s infinite;}
      @keyframes h-draw{from{stroke-dashoffset:1;}to{stroke-dashoffset:0;}}
      @keyframes h-rise{from{opacity:0;}to{opacity:1;}}
      @keyframes h-pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
      .h-curve{stroke-dasharray:1;stroke-dashoffset:1;animation:h-draw 2.2s cubic-bezier(.22,.61,.36,1) .15s forwards;}
      .h-fill{opacity:0;animation:h-rise 1.2s ease-out 1.5s forwards;}
      .h-tip{opacity:0;animation:h-rise .4s ease-out 2.2s forwards;}
      .h-dot{animation:h-pulse 2.4s ease-in-out infinite;}
      @media (prefers-reduced-motion: reduce){
        .h-line{animation:none;opacity:0;}
        .h-l0{opacity:1;}
        .h-curve{animation:none;stroke-dashoffset:0;}
        .h-fill,.h-tip{animation:none;opacity:1;}
        .h-dot{animation:none;}
      }
    </style>
  </defs>

  <rect class="h-bg" width="1200" height="320" rx="14"/>
  <rect width="1200" height="320" rx="14" fill="url(#h-grid)"/>
  <ellipse cx="120" cy="40" rx="520" ry="320" fill="url(#h-glow-a)"/>
  <ellipse cx="1080" cy="320" rx="560" ry="340" fill="url(#h-glow-b)"/>
  <rect class="h-edge" x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none"/>

  <g class="h-mono">
    <text class="h-mu" x="56" y="84" font-size="14" letter-spacing="4.2">INDEPENDENT  ·  SOLO BUILDER</text>
    <text x="56" y="170" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#h-word)">wlylabs</text>
    <rect x="56" y="190" width="96" height="4" rx="2" fill="url(#h-bar)"/>

    <g transform="translate(56 234)">
      <text class="h-aa" x="0" y="0" font-size="19">&#8250;</text>
      <text class="h-tx h-line h-l0" x="20" y="0" font-size="19">Solo builder. Full stack of one.</text>
      <text class="h-tx h-line h-l1" x="20" y="0" font-size="19">Vaults the server is unable to read.</text>
      <text class="h-tx h-line h-l2" x="20" y="0" font-size="19">Keys derived on the device, never uploaded.</text>
      <text class="h-tx h-line h-l3" x="20" y="0" font-size="19">Apps that still open with the network off.</text>
    </g>

    <g transform="translate(56 256)">
      <rect class="h-surf" x="0" y="0" width="122" height="34" rx="17"/>
      <circle class="h-aa h-dot" cx="19" cy="17" r="4"/>
      <text class="h-mu" x="32" y="22" font-size="12" letter-spacing="2.6">SHIPPING</text>
    </g>
  </g>

  <g class="h-mono">
    <text class="h-fa" x="716" y="90" font-size="12" letter-spacing="2.8">PASSPHRASE  ·  PHRASE  ·  PASSKEY</text>
    <line class="h-hair" x1="844.4" y1="104" x2="844.4" y2="260" stroke-width="1" stroke-dasharray="2 6" opacity="0.7"/>
    <line class="h-hair" x1="951.4" y1="104" x2="951.4" y2="260" stroke-width="1" stroke-dasharray="2 6" opacity="0.7"/>
    <line class="h-hair" x1="1058.4" y1="104" x2="1058.4" y2="260" stroke-width="1" stroke-dasharray="2 6" opacity="0.7"/>
    <path class="h-fill" d="M716,118C981.36,118 981.36,182 1144,182C981.36,182 981.36,246 716,246Z" fill="url(#h-area)"/>
    <path class="h-curve" d="M716,118C981.36,118 981.36,182 1144,182" pathLength="1" fill="none" stroke="url(#h-conv)" stroke-width="2.5" stroke-linecap="round"/>
    <path class="h-curve" d="M716,182C981.36,182 981.36,182 1144,182" pathLength="1" fill="none" stroke="url(#h-conv)" stroke-width="2.5" stroke-linecap="round"/>
    <path class="h-curve" d="M716,246C981.36,246 981.36,182 1144,182" pathLength="1" fill="none" stroke="url(#h-conv)" stroke-width="2.5" stroke-linecap="round"/>
    <circle class="h-aa" cx="716" cy="118" r="4.5"/>
    <circle class="h-aa" cx="716" cy="182" r="4.5"/>
    <circle class="h-aa" cx="716" cy="246" r="4.5"/>
    <g class="h-tip">
      <circle class="h-ab" cx="1144" cy="182" r="11" opacity="0.16"/>
      <circle class="h-ab" cx="1144" cy="182" r="4.5"/>
    </g>
    <text class="h-fa" x="1144" y="272" font-size="12" letter-spacing="1.4" text-anchor="end">one root key  ·  never uploaded</text>
  </g>
</svg>
