<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="wlylabs — solo builder shipping zero-knowledge, offline-first web apps">
  <title>wlylabs — solo builder shipping zero-knowledge, offline-first web apps</title>
  <defs>
    <linearGradient id="o-word" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#E8895F"/>
      <stop offset="55%" stop-color="#E8895F"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- User space so the straight middle path still has a gradient to paint. -->
    <linearGradient id="o-conv" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="1104" y2="0">
      <stop offset="0%" stop-color="#E8895F"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="o-area" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8895F" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8895F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#412991" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#412991" stop-opacity="0"/>
    </radialGradient>
    <pattern id="o-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0D1117"/>
  <rect width="1200" height="630" fill="url(#o-grid)"/>
  <ellipse cx="980" cy="560" rx="620" ry="420" fill="url(#o-glow)"/>
  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="96" y="188" font-size="22" letter-spacing="7" fill="#8B949E">INDEPENDENT  ·  SOLO BUILDER</text>
    <text x="96" y="318" font-size="128" font-weight="700" letter-spacing="-4" fill="url(#o-word)">wlylabs</text>
    <text x="96" y="378" font-size="27" fill="#E6EDF3">WebCrypto  ·  Next.js  ·  Passkeys  ·  Offline-first</text>
  </g>
  <path d="M96,408C720.96,408 720.96,468 1104,468C720.96,468 720.96,528 96,528Z" fill="url(#o-area)"/>
  <path d="M96,408C720.96,408 720.96,468 1104,468" fill="none" stroke="url(#o-conv)" stroke-width="4" stroke-linecap="round"/>
  <path d="M96,468C720.96,468 720.96,468 1104,468" fill="none" stroke="url(#o-conv)" stroke-width="4" stroke-linecap="round"/>
  <path d="M96,528C720.96,528 720.96,468 1104,468" fill="none" stroke="url(#o-conv)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="96" cy="408" r="7" fill="#E8895F"/>
  <circle cx="96" cy="468" r="7" fill="#E8895F"/>
  <circle cx="96" cy="528" r="7" fill="#E8895F"/>
  <circle cx="1104" cy="468" r="9" fill="#8B5CF6"/>
  <rect x="96" y="556" width="112" height="5" rx="2.5" fill="url(#o-word)"/>
